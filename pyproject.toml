[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zephyrus"
version = "0.1.0"
description = "Forecast-driven flexibility optimisation for home batteries & EVs (virtual power plant)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ashutosh More" }]
keywords = ["energy", "flexibility", "optimisation", "forecasting", "virtual-power-plant"]

dependencies = [
  "httpx>=0.27",
  "tenacity>=8.2",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pulp>=2.8,<3.0",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15.0",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dashboard = ["streamlit>=1.33", "plotly>=5.20", "streamlit-autorefresh>=1.0"]
# Heavier modelling deps for the forecasting milestones (M3/M4).
ml = ["scikit-learn>=1.4", "lightgbm>=4.3", "mlflow>=2.12", "darts>=0.29"]
dev = [
  "pytest>=8.1",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.4",
  "mypy>=1.10",
  "black>=24.4",
  "pre-commit>=3.7",
]

[project.scripts]
zephyrus = "zephyrus.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zephyrus = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
packages = ["zephyrus"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = "-q --cov=zephyrus --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]
